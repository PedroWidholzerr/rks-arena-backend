name: CI

on:
  push:
  pull_request:

jobs:
  segredos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Varredura de segredos
        run: bash scripts/varrer-segredos.sh

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rks-system
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Testes unitários (sem Docker)
        run: ./mvnw -B test
      - name: Testes de integração (Testcontainers)
        run: ./mvnw -B verify -Pintegracao
