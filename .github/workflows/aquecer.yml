name: Aquecer o backend e o banco

# Faz uma conexão ao banco (via /readyz) para o Supabase gratuito contar atividade e não pausar.
# Só entra no agendamento se o spike 1.3 mostrar que a conexão semanal do backup NÃO evita a pausa
# (ver docs/spike-provedores.md). Enquanto isso, fica só manual: descomente o "schedule" para ativar.
on:
  # schedule:
  #   - cron: "0 12 * * 3"   # quartas, 12:00 UTC
  workflow_dispatch:

jobs:
  aquecer:
    runs-on: ubuntu-latest
    steps:
      - name: Chamar /readyz com espera para o cold start
        run: |
          for tentativa in 1 2 3 4 5 6; do
            codigo=$(curl -s -o /dev/null -w "%{http_code}" --max-time 90 https://rks-arena-backend.onrender.com/readyz || true)
            echo "tentativa $tentativa: HTTP $codigo"
            [ "$codigo" = "200" ] && exit 0
            sleep 15
          done
          echo "O backend não respondeu 200 a tempo."
          exit 1
