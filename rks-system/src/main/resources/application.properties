# Configuração por ambiente (AD-21). Segredos só em variáveis de ambiente; nada de valor padrão sensível.

spring.application.name=rks-system

# Servidor
server.port=${PORT:8081}
server.address=0.0.0.0

# Banco (Supabase pelo session pooler). DATABASE_URL no formato jdbc:postgresql://host:porta/banco
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=4

# JPA e Flyway: o esquema vem só das migrações (db/migration)
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.flyway.enabled=true

# Logs: INFO em tudo (DEBUG vazava cabeçalhos)
logging.level.root=INFO
logging.level.com.rks=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO

# JWT: sem valor padrão. Se JWT_SECRET faltar, a aplicação não sobe (ver JwtService).
jwt.secret=${JWT_SECRET:}
# Sessão de 12 h (FR-40)
jwt.expiration=43200000

# Supabase Storage (imagens)
app.supabase.url=${SUPABASE_URL:}
app.supabase.service-key=${SUPABASE_SERVICE_KEY:}

# Primeiro administrador (criado na subida quando não houver nenhum)
app.admin.email=${ADMIN_EMAIL:}
app.admin.initial-password=${ADMIN_INITIAL_PASSWORD:}
# true por uma subida redefine a senha do único administrador (ver docs/runbook-admin.md)
app.admin.reset-on-boot=${ADMIN_RESET_ON_BOOT:false}

# Upload (FR-24: até 2 MB)
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB

# Partida rápida no Render free (NFR-4): beans criados sob demanda (Flyway fica de fora, ver ConfiguracaoInicializacao)
spring.main.lazy-initialization=true

# ID de correlação em cada linha de log
logging.pattern.level=%5p [%X{correlacaoId:-}]
