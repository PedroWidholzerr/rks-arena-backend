# Testes unitários e de contexto rodam sem banco e sem Docker (AD-19).
# Os testes de integração (@Tag("integration")) usam Testcontainers no perfil "integracao".
spring.datasource.url=jdbc:postgresql://localhost:5432/teste
spring.datasource.username=teste
spring.datasource.password=teste
spring.datasource.hikari.initialization-fail-timeout=-1
spring.jpa.hibernate.ddl-auto=none
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false
spring.flyway.enabled=false
jwt.secret=segredo-somente-para-testes-com-mais-de-32-bytes
