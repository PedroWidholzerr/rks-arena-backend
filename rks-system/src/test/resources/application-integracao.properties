# Testes de integração (@Tag("integration")): Postgres real descartável (Testcontainers), com o Flyway
# aplicando todas as migrações e o Hibernate só validando o mapeamento.
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.main.lazy-initialization=false
app.admin.bootstrap=false
jwt.secret=segredo-somente-para-testes-de-integracao-com-mais-de-32-bytes
# Armazenamento de imagens simulado: a URL pública só precisa de um prefixo estável.
app.supabase.url=http://armazenamento.teste
app.supabase.service-key=chave-de-teste

# Valores de reserva só para o placeholder do application.properties resolver; o Testcontainers (@ServiceConnection)
# sobrepõe a conexão com a do contêiner.
spring.datasource.url=jdbc:postgresql://reserva:5432/reserva
spring.datasource.username=reserva
spring.datasource.password=reserva
